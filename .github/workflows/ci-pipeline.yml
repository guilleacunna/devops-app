name: DevOps CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generar archivo .env para pruebas
        run: |
          echo "POSTGRES_USER=testuser" > .env
          echo "POSTGRES_PASSWORD=testpassword" >> .env
          echo "POSTGRES_DB=testdb" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "DB_HOST=postgres_db" >> .env

      - name: Validar y contruir conteneodores con Docker Compose
        run: |
          docker-compose config
          docker-compose build

      - name: Probar arranque de contenedores
        run: |
          docker-compose up -d
          docker-compose ps
          sleep 5
          docker compose down 
